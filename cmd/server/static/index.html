<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>MicroFlow</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <a class="brand" href="#/dashboard" aria-label="MicroFlow home">
      <span class="brand-mark">M</span>
      <span class="brand-name">MicroFlow</span>
    </a>
    <div class="topbar-spacer"></div>
    <span id="connStatus" class="conn-status conn-unknown">connecting&hellip;</span>
    <div class="settings-wrap">
      <button id="settingsBtn" class="gear-btn" aria-label="Settings" aria-expanded="false">&#9881;&#65039;</button>
      <div id="settingsMenu" class="settings-menu" hidden>
        <a href="#/global-env" class="settings-item">&#127760; Global Environment</a>
        <a href="/logout" class="settings-item">&#128682; Logout</a>
      </div>
    </div>
  </header>

  <div id="pageNav" class="page-nav"></div>
  <main id="view" class="view">
    <!-- rendered by app.js -->
  </main>
</div>

<template id="tpl-toast">
  <div class="toast"></div>
</template>

<script src="/app.js"></script>
</body>
</html>
